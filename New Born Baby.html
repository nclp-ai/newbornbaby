<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫院新生嬰兒統計挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdfa; /* Light teal background */
            margin: 0;
            overflow: hidden;
        }

        .chat-container {
            height: calc(100vh - 180px);
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message-enter {
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #99f6e4; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2dd4bf; 
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Canvas for Fireworks -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- Header -->
    <header class="bg-teal-600 text-white p-4 shadow-md flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-teal-600 font-bold text-xl">
                <i class="fa-solid fa-user-nurse"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">醫院新生嬰兒統計挑戰</h1>
                <p class="text-xs text-teal-100">護士值班中...</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right">
                <div class="text-sm font-semibold">能力值 (HP)</div>
                <div class="flex items-center space-x-1 text-red-400 text-lg" id="hp-display">
                    <!-- HP Icons will be injected here -->
                </div>
            </div>
            <div class="text-right">
                <div class="text-sm font-semibold">得分</div>
                <div class="text-xl font-bold text-yellow-300" id="score-display">0</div>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto bg-white shadow-lg flex flex-col relative overflow-hidden my-4 rounded-xl">
        <div id="chat-box" class="chat-container p-6 flex flex-col space-y-4">
            <!-- Messages will appear here -->
        </div>

        <!-- Input Area -->
        <div class="border-t border-gray-200 p-4 bg-gray-50 flex items-center space-x-3 absolute bottom-0 w-full">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 transition shadow-sm" placeholder="輸入你的答案 / 名字..." autocomplete="off">
            <button id="send-btn" class="bg-teal-600 hover:bg-teal-700 text-white rounded-lg px-6 py-3 font-semibold transition shadow-md flex items-center space-x-2">
                <span>發送</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </main>

    <!-- Leaderboard Modal (Hidden by default) -->
    <div id="leaderboard-modal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="text-center mb-6">
                <i class="fa-solid fa-trophy text-5xl text-yellow-400 mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">任務完成！排行榜</h2>
                <p class="text-gray-500" id="final-congrats"></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-4 mb-6">
                <ul id="leaderboard-list" class="space-y-3">
                    <!-- Leaderboard items -->
                </ul>
            </div>
            <button onclick="location.reload()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-lg transition">
                重新挑戰
            </button>
        </div>
    </div>

    <script>
        // Game State
        const state = {
            step: 0,
            playerName: '',
            hp: 5,
            score: 0,
            mistakesCurrentLevel: 0
        };

        // Game Levels / Script
        const script = [
            {
                type: 'name',
                text: "你準備好接受挑戰未？<br><br>請先輸入你的統計員名稱：",
                img: "https://images.unsplash.com/photo-1581056771107-24ca5f033842?auto=format&fit=crop&w=600&q=80"
            },
            {
                type: 'math',
                text: "你好，{name}！我是負責照顧新生嬰兒的護士。<br><br>根據紀錄，本院內一名新生男嬰體重為 3.7kg 以上的概率是 <b>0.3085</b>，而女嬰體重為 3.7kg 以上的概率是 <b>0.1587</b>。假設生男嬰和生女嬰的概率相等。<br><br><b>任務 1：</b> 求該醫院內隨機一名新生嬰兒的體重為 3.7kg 以上的概率是多少？",
                img: "https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=600&q=80",
                ans: "0.2336",
                hint: "💡 <b>提示：</b> 試想想全概率。男嬰和女嬰各佔一半，只要把他們各自大於 3.7kg 的概率按比例（乘上性別概率）加起來就可以了！"
            },
            {
                type: 'math',
                text: "如果我告訴你，剛剛量度的一名嬰兒體重<b>超過了 3.7kg</b>。<br><br><b>任務 2：</b> 求該名嬰兒為男嬰的概率是多少？（請四捨五入至小數後4個位）",
                img: "https://images.unsplash.com/photo-1555252333-9f8e92e65df9?auto=format&fit=crop&w=600&q=80",
                ans: "0.6603",
                hint: "💡 <b>提示：</b> 這是條件概率喔！已知條件是「體重超過 3.7kg」，所以分母是你在上一關算出的答案。分子則是「既是男嬰又超過 3.7kg」的概率。"
            },
            {
                type: 'mcq',
                text: "進入下一階段前，我們先來測試一下你的基礎知識！<br><br><b>任務 3：</b> 以下哪一條是<b>泊松分佈 (Poisson Distribution)</b> 的公式？（請輸入選項字母 A, B, C 或 D）<br><br><div class='bg-gray-100 p-3 rounded-lg font-mono text-sm space-y-2 mt-2'><b>A.</b> P(X=x) = p<sup>x</sup>(1-p)<sup>1-x</sup><br><b>B.</b> P(X=x) = C<sup>n</sup><sub>x</sub> p<sup>x</sup>(1-p)<sup>n-x</sup><br><b>C.</b> P(X=x) = e<sup>-λ</sup> λ<sup>x</sup> / x!<br><b>D.</b> Σ P(X=x) = 1</div>",
                img: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=600&q=80",
                ans: "C",
                hint: "💡 <b>提示：</b> <br>A 是伯奴尼分佈公式。<br>B 是二項分佈公式。<br>D 只是概率分佈的一般總和公式。<br>想一想含有 λ (平均值) 和 e (自然對數底) 的是哪一個？"
            },
            {
                type: 'math',
                text: "非常棒！現在進入核心數據挑戰！<br><br>已知每日該醫院內新生嬰兒的數目依循一平均值（λ）為 <b>2.1</b> 的<b>泊松分佈</b>。<br><br><b>任務 4：</b> 求某日該醫院內<b>恰好有2名</b>新生嬰兒，且<b>沒有新生嬰兒的體重為 3.7kg 或以下</b>（即兩名嬰兒體重都大於 3.7kg）的概率？（請四捨五入至小數後4個位）",
                img: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=600&q=80",
                ans: "0.0147",
                hint: "💡 <b>提示：</b> 分兩個部分思考：<br>1. 利用剛才選出的泊松分佈公式，求出「恰好有2名嬰兒出生」的概率。<br>2. 結合第1關的答案，求出這2名嬰兒「同時大於3.7kg」的概率。<br>最後把它們相乘。"
            },
            {
                type: 'math',
                text: "挑戰升級！我們現在要尋找一個複雜事件的總概率。<br><br><b>任務 5：</b> 求某日該醫院內有<b>至多2名</b>新生嬰兒，且<b>沒有新生嬰兒體重為 3.7kg 或以下</b>的概率是多少？（請四捨五入至小數後4個位）",
                img: "https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?auto=format&fit=crop&w=600&q=80",
                ans: "0.1973",
                hint: "💡 <b>提示：</b> 「至多2名」代表你需要考慮三種互斥情況並把它們加起來：<br>1. 恰好 0 名嬰兒（既然沒有嬰兒，就自然滿足「沒有人≤3.7kg」的條件了，機率為 P(0)）<br>2. 恰好 1 名嬰兒，且 > 3.7kg<br>3. 恰好 2 名嬰兒，且皆 > 3.7kg（這個你上一關算過囉！）"
            },
            {
                type: 'math',
                text: "終極任務來了！這會結合你前面計算的所有數據！<br><br><b>任務 6：</b> 已知某日該醫院內有至多2名新生嬰兒且沒有新生嬰兒的體重為 3.7 kg 或以下。求當日該醫院內<b>恰好有1名新生男嬰</b>的概率？（請四捨五入至小數後4個位）",
                img: "https://images.unsplash.com/photo-1590650153855-d9e808231d41?auto=format&fit=crop&w=600&q=80",
                ans: "0.2346",
                hint: "💡 <b>提示：</b> 這是進階條件概率！<br>• <b>分母</b>：就是你在第 5 關算出來的結果。<br>• <b>分子</b>：在分母的前提下，要滿足「恰好1名男嬰」。這包含了兩種情況：(A) 總共只出生了1名男嬰（且大於3.7kg）。 (B) 出生了2名嬰兒，剛好是1男1女（皆大於3.7kg），記得這時候男女組合有 2 種排列方式（先男後女或先女後男）！"
            }
        ];

        // Mock Leaderboard Data
        const mockLeaderboard = [
            { name: "李國棟", score: 550 },
            { name: "陳家明", score: 480 },
            { name: "王小玲", score: 420 },
            { name: "張志偉", score: 390 },
            { name: "劉德華 (假)", score: 350 },
            { name: "黃大仙區統籌", score: 310 },
            { name: "周星星", score: 280 },
            { name: "林志玲", score: 240 },
            { name: "吳孟達", score: 190 }
        ];

        // DOM Elements
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const hpDisplay = document.getElementById('hp-display');
        const scoreDisplay = document.getElementById('score-display');

        // Initialize Game
        function init() {
            updateHP();
            progressGame();
            
            sendBtn.addEventListener('click', handleInput);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleInput();
            });
        }

        // Update HP UI
        function updateHP() {
            hpDisplay.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                if (i < state.hp) {
                    hpDisplay.innerHTML += '<i class="fa-solid fa-heart"></i>';
                } else if (i < Math.max(state.hp, 5)) {
                    // Show empty hearts up to max capacity or current
                    hpDisplay.innerHTML += '<i class="fa-regular fa-heart text-gray-300"></i>';
                }
            }
            if(state.hp <= 0) {
                setTimeout(() => {
                    addMessage("系統", "你的能力值已耗盡... 請重新整理頁面再試一次！", false);
                    userInput.disabled = true;
                    sendBtn.disabled = true;
                }, 500);
            }
        }

        function updateScore(points) {
            state.score += points;
            scoreDisplay.innerText = state.score;
            scoreDisplay.classList.add('scale-125', 'text-orange-400');
            setTimeout(() => scoreDisplay.classList.remove('scale-125', 'text-orange-400'), 300);
        }

        // Add Message to Chat
        function addMessage(sender, text, isUser = false, imgUrl = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} message-enter mb-4`;
            
            let innerHTML = '';
            
            if (!isUser) {
                innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-teal-100 border-2 border-teal-500 flex items-center justify-center mr-3 flex-shrink-0 mt-1">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Nurse&style=circle" alt="Nurse" class="w-8 h-8">
                    </div>
                    <div class="bg-white border border-gray-200 text-gray-800 px-5 py-4 rounded-2xl rounded-tl-none shadow-sm max-w-[80%]">
                        <div class="font-bold text-teal-700 text-sm mb-1">${sender}</div>
                        <div class="leading-relaxed text-sm">${text}</div>
                        ${imgUrl ? `<img src="${imgUrl}" class="mt-3 rounded-lg w-full max-w-sm border border-gray-200 shadow-sm" alt="Game Image">` : ''}
                    </div>
                `;
            } else {
                innerHTML = `
                    <div class="bg-teal-600 text-white px-5 py-3 rounded-2xl rounded-tr-none shadow-md max-w-[80%]">
                        <div class="leading-relaxed">${text}</div>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-gray-200 border-2 border-white shadow-sm flex items-center justify-center ml-3 flex-shrink-0 mt-1">
                        <i class="fa-solid fa-user text-gray-500"></i>
                    </div>
                `;
            }

            msgDiv.innerHTML = innerHTML;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Handle User Input
        function handleInput() {
            const val = userInput.value.trim();
            if (!val) return;

            // Display user message
            addMessage(state.playerName || '玩家', val, true);
            userInput.value = '';

            const currentStage = script[state.step];

            setTimeout(() => {
                if (currentStage.type === 'name') {
                    state.playerName = val;
                    state.step++;
                    progressGame();
                } else {
                    
                    let isCorrect = false;
                    
                    if (currentStage.type === 'mcq') {
                        // Check MCQ Answer
                        isCorrect = (val.toUpperCase() === currentStage.ans);
                    } else {
                        // Check Math Answer
                        isCorrect = (val === currentStage.ans || parseFloat(val) === parseFloat(currentStage.ans));
                    }

                    if (isCorrect) {
                        // Correct
                        state.hp += 1;
                        updateHP();
                        updateScore(100 - (state.mistakesCurrentLevel * 20)); // Score based on fewer mistakes
                        addMessage('護士', `<span class="text-green-600 font-bold"><i class="fa-solid fa-unlock"></i> 成功解鎖任務！</span> 獲得 1 點能力值。`, false);
                        
                        state.step++;
                        state.mistakesCurrentLevel = 0;
                        
                        if (state.step < script.length) {
                            setTimeout(progressGame, 1000);
                        } else {
                            setTimeout(endGame, 1500);
                        }
                    } else {
                        // Wrong
                        state.hp -= 1;
                        state.mistakesCurrentLevel++;
                        updateHP();
                        
                        let reply = `<span class="text-red-500"><i class="fa-solid fa-xmark"></i> 哎呀，好像答錯了，扣除 1 點能力值。</span> 請再仔細思考一下！`;
                        
                        if (state.mistakesCurrentLevel >= 2) {
                            reply += `<br><br><div class="bg-yellow-50 p-3 rounded border border-yellow-200 text-yellow-800 text-xs mt-2">${currentStage.hint}</div>`;
                        }
                        
                        addMessage('護士', reply, false);
                    }
                }
            }, 600);
        }

        // Progress to next dialog
        function progressGame() {
            if (state.step >= script.length) return;
            
            const stage = script[state.step];
            let text = stage.text.replace('{name}', state.playerName);
            
            addMessage('護士', text, false, stage.img);
        }

        // End Game and Show Leaderboard
        function endGame() {
            startFireworks();
            
            // Generate Leaderboard
            mockLeaderboard.push({ name: state.playerName + " (你)", score: state.score });
            mockLeaderboard.sort((a, b) => b.score - a.score);
            
            const listHtml = mockLeaderboard.slice(0, 10).map((p, index) => {
                let badge = '';
                if(index === 0) badge = '🥇';
                else if(index === 1) badge = '🥈';
                else if(index === 2) badge = '🥉';
                else badge = `<span class="text-gray-400 font-mono w-5 inline-block">${index+1}.</span>`;

                const isMe = p.name.includes("(你)");
                const bgClass = isMe ? 'bg-teal-100 border border-teal-300' : 'bg-white border border-gray-100';
                const textClass = isMe ? 'text-teal-800 font-bold' : 'text-gray-700';

                return `
                    <li class="flex justify-between items-center p-2 rounded ${bgClass}">
                        <div class="flex items-center space-x-2 text-lg">
                            ${badge} <span class="${textClass}">${p.name}</span>
                        </div>
                        <div class="font-mono font-bold text-gray-600">${p.score}</div>
                    </li>
                `;
            }).join('');

            document.getElementById('leaderboard-list').innerHTML = listHtml;
            document.getElementById('final-congrats').innerText = `恭喜你，${state.playerName}！你已經成功完成所有挑戰，成為新生兒數據大師！`;
            
            const modal = document.getElementById('leaderboard-modal');
            modal.classList.remove('hidden');
            
            // Stop fireworks after a while
            setTimeout(stopFireworks, 8000);
        }

        // --- Fireworks Logic (Canvas) ---
        let fireworksActive = false;
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // gravity
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createFirework(x, y) {
            const colors = ['#f43f5e', '#ec4899', '#d946ef', '#8b5cf6', '#3b82f6', '#06b6d4', '#10b981', '#eab308'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            if (!fireworksActive && particles.length === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (fireworksActive && Math.random() < 0.05) {
                createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.5);
            }

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });

            requestAnimationFrame(animateFireworks);
        }

        function startFireworks() {
            canvas.style.display = 'block';
            fireworksActive = true;
            animateFireworks();
        }

        function stopFireworks() {
            fireworksActive = false;
            setTimeout(() => { canvas.style.display = 'none'; }, 2000);
        }

        // Start App
        window.onload = init;

    </script>
</body>
</html>
